[workspace]
resolver = "2"
members = ["studio-core", "studio-server", "studio-desktop"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Zolon Farsane"]

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde_json = { version = "1", features = ["preserve_order"] }
rust-embed = "8"
