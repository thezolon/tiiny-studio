# Rust port checks on pull requests and on main when they touch it: cargo tests on Windows, macOS and
# Linux, the contract tests (Python reference vs Rust, against the fake Tiiny), a desktop app build and an
# accessibility check of the web UI (axe-core).
# Not on tags or other branch pushes: a release's commit is already tested in its PR and on main, and the
# extra runs held up the release build's runners. Never contacts a real device.
name: Rust

on:
  push:
    branches: [main]
    paths: ["rust/**", "static/**", "testdata/fake_tiiny.py", "testdata/a11y_check.py", "testdata/contract/**", "*.py", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "static/**", "testdata/fake_tiiny.py", "testdata/a11y_check.py", "testdata/contract/**", "*.py", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: Windows ARM, os: windows-11-arm }
          - { name: macOS, os: macos-latest }
          - { name: Linux, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Linux desktop libraries (WebKitGTK)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable branch, 2026-10-16
        with: { toolchain: stable }   # pinned by commit, so the toolchain can't come from the ref name
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with: { workspaces: rust }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: { python-version: "3.12" }
      - name: cargo test
        run: cargo test --workspace
      - name: Build the server and the desktop app
        run: cargo build --workspace
      - name: Contract tests (fake Tiiny)
        working-directory: .
        shell: bash
        run: if [ -d testdata/contract ]; then python -m unittest discover testdata/contract -v; else echo "no contract tests yet"; fi
      - name: Document reader parity (Python vs Rust)
        working-directory: .
        shell: bash
        run: |
          pip install pillow python-docx
          python testdata/extract_parity.py

  a11y:
    name: Accessibility (axe-core, WCAG 2.2 AA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: { python-version: "3.12" }
      - name: Playwright and Chromium
        run: |
          pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Check every workspace, the drawer and the dialogs (fake Tiiny)
        run: python testdata/a11y_check.py

  lint:
    name: Lint (clippy, ruff)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Linux desktop libraries (WebKitGTK)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable branch, 2026-10-16
        with: { toolchain: stable, components: clippy }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with: { workspaces: rust }
      - name: clippy (no warnings)
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: ruff (pyflakes + bugbear)
        run: |
          pip install ruff==0.17.3
          ruff check --select F,B server.py media.py chat.py extract.py safety.py tools testdata
